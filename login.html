<!DOCTYPE html>
<html lang="nb">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Logg inn · Reklameforståelse</title>
  <link rel="stylesheet" href="styles.css" />

  <link rel="icon" type="image/x-icon" href="assets/favicon/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon/favicon-16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon/apple-touch-icon.png" />
</head>
<body class="login-body">

<main class="login">
  <div class="login-card">

    <div class="login-mark">
      <img src="assets/logo/logo-primary-black.png" alt="Morgenstern" />
    </div>

    <h1>Reklameforståelse</h1>
    <p class="login-sub">— et krasjkurs fra Morgenstern</p>

    <form id="login-form" class="login-form" method="post" action="/logginn">
      <label for="email">E-post</label>
      <input type="email" id="email" name="epost" required autocomplete="email" autofocus placeholder="navn@firma.no" />
      <label for="kode">Tilgangskode</label>
      <input type="text" id="kode" name="kode" required autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="ord-ord-1234" />
      <input type="hidden" id="return" name="return" value="/" />
      <button type="submit" class="btn">Logg inn</button>
      <div id="login-error" class="login-error" hidden></div>
    </form>
    <p class="login-foot">Mangler du kode? Ta kontakt med Morgenstern.</p>

  </div>
</main>

<script>
  (function () {
    'use strict';
    var KEY = 'reklameforstaelse.user.email';
    var params = new URLSearchParams(window.location.search);
    var ret = params.get('return') || '/';
    if (ret.charAt(0) !== '/' || ret.indexOf('//') === 0) ret = '/';
    document.getElementById('return').value = ret;
    var errorEl = document.getElementById('login-error');
    if (params.get('feil')) {
      var f = params.get('feil');
      errorEl.textContent = f === 'utlopt'
        ? 'Tilgangskoden har utløpt. Ta kontakt med Morgenstern.'
        : f === 'domene'
          ? 'Denne koden gjelder bare for e-poster i Morgenstern. Sjekk e-posten du skrev inn.'
          : 'Vi fant ikke den tilgangskoden. Sjekk at den er skrevet riktig.';
      errorEl.hidden = false;
    }
    try { var saved = localStorage.getItem(KEY); if (saved) document.getElementById('email').value = saved; } catch (e) {}
    document.getElementById('login-form').addEventListener('submit', function () {
      var email = (document.getElementById('email').value || '').trim().toLowerCase();
      try { localStorage.setItem(KEY, email); } catch (e) {}
    });
  })();
</script>

</body>
</html>
