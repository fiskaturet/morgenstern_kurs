name: Synk fra Notion

# Henter publiserte økter fra Notion, rendrer HTML og pusher.
# Vercel deployer automatisk når main endres.
on:
  schedule:
    - cron: '*/15 * * * *'   # hvert kvarter
  workflow_dispatch:          # «Run workflow»-knappen i GitHub
    inputs:
      oppsett:
        description: 'Engangsoppsett: lag databasen i Notion og importer øktene fra repoet'
        type: boolean
        default: false
  repository_dispatch:
    types: [notion-publish]   # for evt. webhook/knapp senere
  push:
    branches: [main]
    paths: ['kurs-innhold/ny/**']   # ny versjon av kurset: erstatt innholdet i Notion

permissions:
  contents: write

concurrency:
  group: notion-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - name: Engangsoppsett (database + import)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.oppsett }}
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ vars.NOTION_DATABASE_ID }}
        run: python notion_sync.py bootstrap 3f0630f7034d80358354e4342a3d5155

      - name: Erstatt innhold i Notion med kurs-innhold/ny
        if: ${{ github.event_name == 'push' && hashFiles('kurs-innhold/ny/dag-*.md') != '' }}
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ vars.NOTION_DATABASE_ID }}
        run: |
          python notion_sync.py replace
          git rm -r -q kurs-innhold/ny

      - name: Hent innhold fra Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ vars.NOTION_DATABASE_ID }}
        run: python notion_sync.py pull

      - name: Rendre HTML
        run: python render_lessons.py

      - name: Commit og push hvis noe er endret
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kurs-innhold dag-*.html
          if git diff --staged --quiet; then
            echo "Ingen endringer i Notion."
          else
            git commit -m "Notion-synk: oppdatert kursinnhold"
            git push
          fi
